<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-beige">
    <div class="d-flex flex-column min-vh-100 container p-0" id="main-container">
        <nav class="navbar navbar-expand-lg p-3 bg-green">
            <div class="container-fluid"> <a class="navbar-brand" href="{{ url_for('home') }}">Recipeasy</a> <button class="navbar-toggler"
                    type="button" data-bs-toggle="collapse" data-bs-target="#navbars-collapsable"
                    aria-controls="navbars-collapsable" aria-expanded="false" aria-label="Toggle navigation"> <span
                        class="navbar-toggler-icon"></span> </button>
                <div class="collapse navbar-collapse" id="navbar-collapsable">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"> <a class="nav-link" href="{{ url_for('random_recipe') }}">Random Meal</a> </li>
                        <li class="nav-item dropdown"> <a class="nav-link dropdown-toggle" href="#"
                                data-bs-toggle="dropdown" aria-expanded="false">Filter by</a>
                            <ul class="dropdown-menu bg-yellow">
                                <li><a class="dropdown-item" href="{{ url_for('filter_list', filter_type='c') }}">Category</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('filter_list', filter_type='a') }}">Region</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('filter_list', filter_type='i') }}">Main Ingredient</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form role="search" action="{{ url_for('search') }}" method="GET" class="d-flex">
                        <input class="form-control me-2" 
                            type="search" 
                            placeholder="Search recipes..." 
                            aria-label="Search" 
                            name="q" 
                            required>
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>



        <main class="flex-grow-1 container">
            {% block content %}
            {% endblock %}
        </main>


        <footer class="bg-green text-white py-3 mt-4">
            <div class="container text-center">
                <p class="mb-0">
                    &copy; Murilo Matsuora 2026 | Powered by <a class="no-text-decoration" href="https://www.themealdb.com/api.php">The Meal DB</a>
                </p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
